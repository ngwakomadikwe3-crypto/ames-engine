name: Validate Diamond Ring FBX Conversion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-and-validate:
    runs-on: ubuntu-24.04
    env:
      BLENDER_VERSION: 4.4.3
      BLENDER_ARCHIVE: blender-4.4.3-linux-x64.tar.xz
      SOURCE: public/models/diamond_ring_candidate.fbx
      TARGET: public/models/diamond_ring_candidate_blender.glb
      REPORT: conversion-validation-report.md

    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Download and verify pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          cd "$RUNNER_TEMP/blender"
          curl --fail --location --retry 3 --output "$BLENDER_ARCHIVE" \
            "https://download.blender.org/release/Blender4.4/$BLENDER_ARCHIVE"
          curl --fail --location --retry 3 --output "$BLENDER_ARCHIVE.sha256" \
            "https://download.blender.org/release/Blender4.4/blender-4.4.3.sha256"
          awk -v archive="$BLENDER_ARCHIVE" '$0 ~ archive { print $1 "  " archive; found=1; exit } END { if (!found) exit 1 }' "$BLENDER_ARCHIVE.sha256" | sha256sum --check --status -
          tar -xJf "$BLENDER_ARCHIVE"
          echo "BLENDER_BIN=$RUNNER_TEMP/blender/blender-$BLENDER_VERSION-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Convert FBX to GLB without destructive processing
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE"
          "$BLENDER_BIN" --background --factory-startup --python-expr '
          import bpy
          import sys
          source = sys.argv[-2]
          target = sys.argv[-1]
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.fbx(filepath=source, use_custom_normals=True)
          bpy.ops.export_scene.gltf(
              filepath=target,
              export_format="GLB",
              use_selection=False,
              export_apply=False,
              export_animations=False,
              export_morph=False,
              export_skins=False,
              export_normals=True,
              export_materials="EXPORT",
              export_keep_originals=True,
              export_draco_mesh_compression_enable=False,
          )
          ' -- "$SOURCE" "$TARGET"
          test -s "$TARGET"

      - name: Compare FBX and GLB independently
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js'
          import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
          import { Box3, Matrix4, Vector3 } from 'three'

          const sourcePath = process.env.SOURCE
          const targetPath = process.env.TARGET
          const reportPath = process.env.REPORT
          const asArrayBuffer = (path) => {
            const data = readFileSync(path)
            return data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength)
          }
          const source = new FBXLoader().parse(asArrayBuffer(sourcePath), '')
          const target = (await new GLTFLoader().parseAsync(asArrayBuffer(targetPath), '')).scene
          const discrepancies = []
          const diagnostics = []
          const WORLD_TOLERANCE = 1e-4
          const METRIC_TOLERANCE = 1e-3
          const close = (a, b, tolerance = METRIC_TOLERANCE) => Math.abs(a - b) <= tolerance + Math.max(Math.abs(a), Math.abs(b)) * 1e-6
          const vectorsClose = (a, b, tolerance = METRIC_TOLERANCE) => a.length === b.length && a.every((value, index) => close(value, b[index], tolerance))
          const normalizedCoordinateBasis = new Matrix4()
          const normalizeWorldPoint = (object, point) => point.applyMatrix4(object.matrixWorld).applyMatrix4(normalizedCoordinateBasis)

          function inspect(root) {
            root.updateMatrixWorld(true)
            const nodes = []
            root.traverse((object) => {
              const node = { object, name: object.name, type: object.type, parent: object.parent?.name ?? null, children: object.children.map((child) => child.name), position: object.position.toArray(), quaternion: object.quaternion.toArray(), scale: object.scale.toArray() }
              if (object.isMesh) {
                const geometry = object.geometry
                const position = geometry.getAttribute('position')
                const normal = geometry.getAttribute('normal')
                const materials = Array.isArray(object.material) ? object.material : [object.material]
                node.vertices = position?.count ?? 0
                node.triangles = geometry.index ? geometry.index.count / 3 : (position?.count ?? 0) / 3
                node.indexed = Boolean(geometry.index)
                node.normals = Boolean(normal && normal.count === position?.count)
                node.materials = materials.map((material) => material?.name ?? null)
                node.groups = geometry.groups.length ? geometry.groups.map((group) => ({ start: group.start, count: group.count, triangles: group.count / 3, material: materials[group.materialIndex]?.name ?? null })) : [{ start: 0, count: node.indexed ? geometry.index.count : node.vertices, triangles: node.triangles, material: materials[0]?.name ?? null }]
                node.materialTriangles = node.groups.reduce((totals, group) => ({ ...totals, [group.material]: (totals[group.material] ?? 0) + group.triangles }), {})
                const box = new Box3().setFromObject(object)
                node.bounds = { min: box.min.toArray(), max: box.max.toArray() }
              }
              nodes.push(node)
            })
            return nodes
          }

          function meshTriangles(node, group) {
            const geometry = node.object.geometry
            const position = geometry.getAttribute('position')
            const index = geometry.index
            const start = group.start
            const end = start + group.count
            const triangles = []
            for (let offset = start; offset < end; offset += 3) {
              const readIndex = (value) => index ? index.getX(value) : value
              const points = [0, 1, 2].map((corner) => {
                const vertexIndex = readIndex(offset + corner)
                return normalizeWorldPoint(node.object, new Vector3().fromBufferAttribute(position, vertexIndex)).toArray()
              })
              triangles.push(points)
            }
            return triangles
          }

          function population(nodes, material) {
            const triangles = nodes.flatMap((node) => node.groups.filter((group) => group.material === material).flatMap((group) => meshTriangles(node, group)))
            const points = triangles.flat()
            const min = [Infinity, Infinity, Infinity]
            const max = [-Infinity, -Infinity, -Infinity]
            const centroid = [0, 0, 0]
            let area = 0
            let signedVolume = 0
            for (const point of points) for (let axis = 0; axis < 3; axis += 1) { min[axis] = Math.min(min[axis], point[axis]); max[axis] = Math.max(max[axis], point[axis]); centroid[axis] += point[axis] }
            for (let axis = 0; axis < 3; axis += 1) centroid[axis] /= points.length / 3
            for (const [a, b, c] of triangles) {
              const ab = new Vector3().fromArray(b).sub(new Vector3().fromArray(a))
              const ac = new Vector3().fromArray(c).sub(new Vector3().fromArray(a))
              area += ab.cross(ac).length() / 2
              signedVolume += new Vector3().fromArray(a).dot(new Vector3().fromArray(b).cross(new Vector3().fromArray(c))) / 6
            }
            const fingerprint = triangles.map((triangle) => triangle.map((point) => point.map((value) => Math.round(value / WORLD_TOLERANCE)).join(',')).sort().join('|')).sort().join(';')
            return { triangles: triangles.length, fingerprint, area, signedVolume, centroid, dimensions: max.map((value, axis) => value - min[axis]), bounds: { min, max } }
          }

          function comparePopulation(label, expected, actual) {
            if (!expected || !actual) { discrepancies.push(`${label} world-space population missing`); return }
            if (expected.triangles !== actual.triangles) discrepancies.push(`${label} triangle count changed: FBX ${expected.triangles}, GLB ${actual.triangles}`)
            if (expected.fingerprint !== actual.fingerprint) discrepancies.push(`${label} world-space triangle fingerprint changed (tolerance ${WORLD_TOLERANCE})`)
            if (!close(expected.area, actual.area)) discrepancies.push(`${label} surface area changed: FBX ${expected.area}, GLB ${actual.area}`)
            if (!vectorsClose(expected.centroid, actual.centroid)) discrepancies.push(`${label} world-space centroid changed`)
            if (!vectorsClose(expected.dimensions, actual.dimensions)) discrepancies.push(`${label} world-space dimensions changed`)
            if (Math.abs(expected.signedVolume) > METRIC_TOLERANCE && !close(Math.abs(expected.signedVolume), Math.abs(actual.signedVolume))) discrepancies.push(`${label} signed volume changed`)
          }

          const sourceNodes = inspect(source)
          const targetNodes = inspect(target)
          const sourceMeshes = sourceNodes.filter((node) => node.type === 'Mesh')
          const targetMeshes = targetNodes.filter((node) => node.type === 'Mesh')
          const sourceNames = new Set(sourceNodes.map((node) => node.name))
          const targetNames = new Set(targetNodes.map((node) => node.name))
          for (const name of ['Diamond', 'GEMS']) {
            if (!sourceNames.has(name)) discrepancies.push(`Source semantic node missing: ${name}`)
            if (!targetNames.has(name)) discrepancies.push(`GLB semantic node missing: ${name}`)
          }

          const sourceMaterials = new Set(sourceMeshes.flatMap((node) => node.materials))
          const targetMaterials = new Set(targetMeshes.flatMap((node) => node.materials))
          for (const material of ['Gold', 'Dimond', 'Material']) {
            if (!sourceMaterials.has(material)) discrepancies.push(`Source material missing: ${material}`)
            if (!targetMaterials.has(material)) discrepancies.push(`GLB material missing: ${material}`)
            comparePopulation(`${material} material population`, population(sourceMeshes, material), population(targetMeshes, material))
          }
          if (JSON.stringify([...sourceMaterials].sort()) !== JSON.stringify([...targetMaterials].sort())) diagnostics.push(`Material names changed: FBX [${[...sourceMaterials].sort().join(', ')}], GLB [${[...targetMaterials].sort().join(', ')}]`)
          if (sourceMeshes.reduce((sum, node) => sum + node.triangles, 0) !== targetMeshes.reduce((sum, node) => sum + node.triangles, 0)) discrepancies.push(`Total triangle count changed: FBX ${sourceMeshes.reduce((sum, node) => sum + node.triangles, 0)}, GLB ${targetMeshes.reduce((sum, node) => sum + node.triangles, 0)}`)
          if (targetMeshes.some((node) => !node.normals)) discrepancies.push(`Normals missing on GLB mesh: ${targetMeshes.find((node) => !node.normals).name}`)

          const sourceDiamond = sourceNodes.find((node) => node.name === 'Diamond')
          const targetDiamond = targetNodes.find((node) => node.name === 'Diamond')
          const sourceGems = sourceNodes.find((node) => node.name === 'GEMS')
          const targetGems = targetNodes.find((node) => node.name === 'GEMS')
          for (const [label, expected, actual] of [['Diamond', sourceDiamond, targetDiamond], ['GEMS', sourceGems, targetGems]]) {
            if (!expected || !actual) { discrepancies.push(`${label} node missing`); continue }
            if (expected.type !== actual.type) diagnostics.push(`${label} representation changed: FBX ${expected.type}, GLB ${actual.type}`)
            if (expected.parent !== actual.parent) diagnostics.push(`${label} parent name changed: FBX ${expected.parent}, GLB ${actual.parent}`)
            if (expected.triangles !== actual.triangles) discrepancies.push(`${label} triangle count changed: FBX ${expected.triangles}, GLB ${actual.triangles}`)
            if (!actual.normals) discrepancies.push(`${label} normals missing`)
            comparePopulation(`${label} node geometry`, population([expected], expected.materials[0]), population([actual], actual.materials[0]))
            if (!vectorsClose(expected.position, actual.position) || !vectorsClose(expected.quaternion, actual.quaternion) || !vectorsClose(expected.scale, actual.scale)) diagnostics.push(`${label} local transform changed; world-space geometry is authoritative`)
          }

          const ringSource = sourceNodes.find((node) => node.name === 'Ring' && node.type === 'Mesh')
          const ringTarget = targetNodes.find((node) => node.name === 'Ring')
          if (!ringSource) diagnostics.push('Source Ring mesh boundary is unavailable')
          if (!ringTarget) diagnostics.push('GLB Ring semantic parent/group is unavailable')
          if (ringTarget && ringTarget.type !== 'Mesh') diagnostics.push(`GLB Ring representation changed: FBX Mesh, GLB ${ringTarget.type}`)
          const ringTargetMeshes = targetNodes.filter((node) => node.parent === 'Ring' && node.type === 'Mesh')
          const goldParts = targetMeshes.filter((node) => node.materials.includes('Gold'))
          const dimondParts = targetMeshes.filter((node) => node.materials.includes('Dimond'))
          if (!goldParts.length) discrepancies.push('GLB Gold material population missing')
          if (!dimondParts.length) discrepancies.push('GLB Dimond material population missing')
          if (ringSource && ringTarget) {
            if (JSON.stringify(ringSource.children) !== JSON.stringify(ringTarget.children)) diagnostics.push(`Ring child representation changed: FBX [${ringSource.children.join(', ')}], GLB [${ringTarget.children.join(', ')}]`)
            if (!vectorsClose(ringSource.position, ringTarget.position) || !vectorsClose(ringSource.quaternion, ringTarget.quaternion) || !vectorsClose(ringSource.scale, ringTarget.scale)) diagnostics.push('Ring local transform changed; world-space geometry is authoritative')
          }
          if (targetDiamond && targetGems && targetDiamond.object === targetGems.object) discrepancies.push('Diamond and GEMS were merged')
          if (targetDiamond?.parent !== 'Ring' || targetGems?.parent !== 'Ring') diagnostics.push('Diamond/GEMS parent representation changed; component identity and world-space geometry are authoritative')
          if (targetNodes.some((node) => ['Circle002', 'Circle002_1'].includes(node.name))) diagnostics.push('Circle002/Circle002_1 generated names accepted as local representation')
          if (ringTargetMeshes.some((node) => !['Diamond', 'GEMS', 'Circle002', 'Circle002_1'].includes(node.name))) diagnostics.push('Ring contains generated child mesh names accepted as local representation')

          const semantic = [
            `METAL: ${targetMaterials.has('Gold') && goldParts.length ? 'PASS' : 'FAIL'}`,
            `CENTER_STONE: ${Boolean(targetDiamond && targetDiamond.type === 'Mesh' && targetDiamond.materials.length > 0) ? 'PASS' : 'FAIL'}`,
            `ACCENT_STONE: ${Boolean(targetGems && targetGems.type === 'Mesh' && targetGems.triangles > 0) ? 'PASS' : 'FAIL'}`,
          ]
          if (semantic.some((line) => line.endsWith('FAIL'))) discrepancies.push('One or more required semantic classes failed')

          const result = discrepancies.length === 0 ? 'CONVERSION PASS' : 'CONVERSION FAIL'
          const report = [
            `# Blender FBX to GLB Validation`, ``, `## ${result}`, ``,
            `Source: ${sourcePath}`, `Target: ${targetPath}`,
            `Source bytes: ${readFileSync(sourcePath).byteLength}`, `Target bytes: ${readFileSync(targetPath).byteLength}`, ``,
            `## Semantic validation`, ...semantic.map((line) => `- ${line}`), ``,
            `## Normalized world-space methodology`,
            `- Coordinate basis: common loader basis with node matrixWorld applied`,
            `- Triangle fingerprint tolerance: ${WORLD_TOLERANCE}`,
            `- Raw vertex-count equality: not required`,
            `- Local transform differences: diagnostic only when world-space geometry matches`, ``,
            `## Structural comparison`,
            `- FBX mesh nodes: ${sourceMeshes.map((node) => node.name).join(', ')}`,
            `- GLB mesh nodes: ${targetMeshes.map((node) => node.name).join(', ')}`,
            `- GLB Ring node type: ${ringTarget?.type ?? 'missing'}`,
            `- GLB Gold population: ${goldParts.length ? 'PASS' : 'FAIL'}`,
            `- GLB Dimond population: ${dimondParts.length ? 'PASS' : 'FAIL'}`,
            `- Diamond separate from GEMS: ${targetDiamond && targetGems && targetDiamond.object !== targetGems.object ? 'PASS' : 'FAIL'}`,
            `- Ring representation: ${ringTarget ? 'PRESENT' : 'DIAGNOSTIC ONLY'}`, ``,
            `## Diagnostics`, ...(diagnostics.length ? diagnostics.map((item) => `- ${item}`) : ['- None']), ``,
            `## Discrepancies`, ...(discrepancies.length ? discrepancies.map((item) => `- ${item}`) : ['- None']),
          ].join('\\n') + '\\n'
          writeFileSync(reportPath, report)
          console.log(report)
          if (discrepancies.length) process.exit(1)
          NODE

      - name: Upload conversion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-ring-blender-conversion-validation
          if-no-files-found: error
          path: |
            public/models/diamond_ring_candidate_blender.glb
            conversion-validation-report.md