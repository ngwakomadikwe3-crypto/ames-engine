name: Validate Diamond Ring FBX Conversion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convert-and-validate:
    runs-on: ubuntu-24.04
    env:
      BLENDER_VERSION: 4.4.3
      BLENDER_ARCHIVE: blender-4.4.3-linux-x64.tar.xz
      SOURCE: public/models/diamond_ring_candidate.fbx
      TARGET: public/models/diamond_ring_candidate_blender.glb
      REPORT: conversion-validation-report.md

    steps:
      - name: Check out canonical source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install validation dependencies
        run: npm ci

      - name: Download and verify pinned Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          cd "$RUNNER_TEMP/blender"
          curl --fail --location --retry 3 --output "$BLENDER_ARCHIVE" \
            "https://download.blender.org/release/Blender4.4/$BLENDER_ARCHIVE"
          curl --fail --location --retry 3 --output "$BLENDER_ARCHIVE.sha256" \
            "https://download.blender.org/release/Blender4.4/blender-4.4.3.sha256"
          awk -v archive="$BLENDER_ARCHIVE" '$0 ~ archive { print $1 "  " archive; found=1; exit } END { if (!found) exit 1 }' "$BLENDER_ARCHIVE.sha256" | sha256sum --check --status -
          tar -xJf "$BLENDER_ARCHIVE"
          echo "BLENDER_BIN=$RUNNER_TEMP/blender/blender-$BLENDER_VERSION-linux-x64/blender" >> "$GITHUB_ENV"

      - name: Convert FBX to GLB without destructive processing
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SOURCE"
          "$BLENDER_BIN" --background --factory-startup --python-expr '
          import bpy
          import sys
          source = sys.argv[-2]
          target = sys.argv[-1]
          bpy.ops.wm.read_factory_settings(use_empty=True)
          bpy.ops.import_scene.fbx(filepath=source, use_custom_normals=True)
          bpy.ops.export_scene.gltf(
              filepath=target,
              export_format="GLB",
              use_selection=False,
              export_apply=False,
              export_animations=False,
              export_morph=False,
              export_skins=False,
              export_normals=True,
              export_materials="EXPORT",
              export_keep_originals=True,
              export_draco_mesh_compression_enable=False,
              export_optimize_animation=False,
          )
          ' -- "$SOURCE" "$TARGET"
          test -s "$TARGET"

      - name: Compare FBX and GLB independently
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          import { FBXLoader } from 'three/examples/jsm/loaders/FBXLoader.js'
          import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js'
          import { Box3, Vector3 } from 'three'

          const sourcePath = process.env.SOURCE
          const targetPath = process.env.TARGET
          const reportPath = process.env.REPORT
          const asArrayBuffer = (path) => {
            const data = readFileSync(path)
            return data.buffer.slice(data.byteOffset, data.byteOffset + data.byteLength)
          }
          const source = new FBXLoader().parse(asArrayBuffer(sourcePath), '')
          const target = (await new GLTFLoader().parseAsync(asArrayBuffer(targetPath), '')).scene
          const discrepancies = []
          const close = (a, b, tolerance = 1e-3) => Math.abs(a - b) <= tolerance
          const vectorsClose = (a, b, tolerance = 1e-3) => a.length === b.length && a.every((value, index) => close(value, b[index], tolerance))

          function inspect(root) {
            root.updateMatrixWorld(true)
            const nodes = []
            root.traverse((object) => {
              const node = {
                name: object.name,
                type: object.type,
                parent: object.parent?.name ?? null,
                children: object.children.map((child) => child.name),
                position: object.position.toArray(),
                quaternion: object.quaternion.toArray(),
                scale: object.scale.toArray(),
              }
              if (object.isMesh) {
                const position = object.geometry.getAttribute('position')
                const normal = object.geometry.getAttribute('normal')
                const box = new Box3().setFromObject(object)
                node.vertices = position?.count ?? 0
                node.triangles = object.geometry.index ? object.geometry.index.count / 3 : (position?.count ?? 0) / 3
                node.normals = Boolean(normal && normal.count === position?.count)
                node.materials = (Array.isArray(object.material) ? object.material : [object.material]).map((material) => material?.name ?? null)
                node.groups = object.geometry.groups.map((group) => ({
                  triangles: group.count / 3,
                  material: (Array.isArray(object.material) ? object.material[group.materialIndex] : object.material)?.name ?? null,
                }))
                node.bounds = { min: box.min.toArray(), max: box.max.toArray() }
              }
              nodes.push(node)
            })
            return nodes
          }

          const sourceNodes = inspect(source)
          const targetNodes = inspect(target)
          const sourceMeshes = sourceNodes.filter((node) => node.type === 'Mesh')
          const targetMeshes = targetNodes.filter((node) => node.type === 'Mesh')
          const sourceNames = new Set(sourceNodes.map((node) => node.name))
          const targetNames = new Set(targetNodes.map((node) => node.name))
          for (const name of ['Ring', 'Diamond', 'GEMS']) {
            if (!sourceNames.has(name)) discrepancies.push(`Source node missing: ${name}`)
            if (!targetNames.has(name)) discrepancies.push(`GLB node missing: ${name}`)
          }

          const sourceMaterials = new Set(sourceMeshes.flatMap((node) => node.materials))
          const targetMaterials = new Set(targetMeshes.flatMap((node) => node.materials))
          for (const material of ['Gold', 'Dimond', 'Material']) {
            if (!sourceMaterials.has(material)) discrepancies.push(`Source material missing: ${material}`)
            if (!targetMaterials.has(material)) discrepancies.push(`GLB material missing: ${material}`)
          }

          function materialTriangles(nodes, material) {
            return nodes.flatMap((node) => node.groups.length ? node.groups : node.materials.map((name) => ({ triangles: node.triangles, material: name })))
              .filter((group) => group.material === material)
              .reduce((sum, group) => sum + group.triangles, 0)
          }
          for (const material of ['Gold', 'Dimond', 'Material']) {
            const expected = materialTriangles(sourceMeshes, material)
            const actual = materialTriangles(targetMeshes, material)
            if (expected !== actual) discrepancies.push(`${material} triangle assignment changed: FBX ${expected}, GLB ${actual}`)
          }

          const sourceDiamond = sourceNodes.find((node) => node.name === 'Diamond')
          const targetDiamond = targetNodes.find((node) => node.name === 'Diamond')
          const sourceGems = sourceNodes.find((node) => node.name === 'GEMS')
          const targetGems = targetNodes.find((node) => node.name === 'GEMS')
          for (const [label, expected, actual] of [['Diamond', sourceDiamond, targetDiamond], ['GEMS', sourceGems, targetGems]]) {
            if (expected && actual) {
              if (expected.parent !== actual.parent) discrepancies.push(`${label} parent changed: FBX ${expected.parent}, GLB ${actual.parent}`)
              if (!vectorsClose(expected.position, actual.position) || !vectorsClose(expected.quaternion, actual.quaternion) || !vectorsClose(expected.scale, actual.scale)) discrepancies.push(`${label} transform changed`)
              if (expected.vertices !== actual.vertices || expected.triangles !== actual.triangles) discrepancies.push(`${label} geometry count changed: FBX ${expected.vertices} vertices/${expected.triangles} triangles, GLB ${actual.vertices} vertices/${actual.triangles} triangles`)
              if (expected.normals !== actual.normals) discrepancies.push(`${label} normals changed`)
              if (expected.bounds && actual.bounds && (!vectorsClose(expected.bounds.min, actual.bounds.min) || !vectorsClose(expected.bounds.max, actual.bounds.max))) discrepancies.push(`${label} world bounds changed`)
            }
          }

          const ringSource = sourceNodes.find((node) => node.name === 'Ring' && node.type === 'Mesh')
          const ringTarget = targetNodes.find((node) => node.name === 'Ring')
          if (!ringTarget) discrepancies.push('GLB Ring semantic parent missing')
          if (ringTarget && !['Group', 'Mesh', 'Object3D'].includes(ringTarget.type)) discrepancies.push(`GLB Ring node has unexpected type: ${ringTarget.type}`)
          const ringTargetMeshes = targetNodes.filter((node) => node.parent === 'Ring' && node.type === 'Mesh')
          if (!ringTargetMeshes.some((node) => node.materials.includes('Gold'))) discrepancies.push('GLB Ring/Gold separation missing')
          if (ringSource && ringTarget && (!vectorsClose(ringSource.position, ringTarget.position) || !vectorsClose(ringSource.quaternion, ringTarget.quaternion) || !vectorsClose(ringSource.scale, ringTarget.scale))) discrepancies.push('Ring transform changed')
          if (!targetDiamond || !targetGems || targetDiamond.parent === targetGems.parent && targetDiamond.name === targetGems.name) discrepancies.push('Diamond and GEMS are not separately identifiable')

          const semantic = [
            `METAL: ${targetMaterials.has('Gold') && ringTargetMeshes.some((node) => node.materials.includes('Gold')) ? 'PASS' : 'FAIL'}`,
            `CENTER_STONE: ${Boolean(targetDiamond && targetDiamond.type === 'Mesh' && targetDiamond.materials.length > 0) ? 'PASS' : 'FAIL'}`,
            `ACCENT_STONE: ${Boolean(targetGems && targetGems.type === 'Mesh' && targetGems.triangles > 0) ? 'PASS' : 'FAIL'}`,
          ]
          if (semantic.some((line) => line.endsWith('FAIL'))) discrepancies.push('One or more required semantic classes failed')

          const result = discrepancies.length === 0 ? 'CONVERSION PASS' : 'CONVERSION FAIL'
          const report = [
            `# Blender FBX to GLB Validation`,
            ``,
            `## ${result}`,
            ``,
            `Source: ${sourcePath}`,
            `Target: ${targetPath}`,
            `Source bytes: ${readFileSync(sourcePath).byteLength}`,
            `Target bytes: ${readFileSync(targetPath).byteLength}`,
            ``,
            `## Semantic validation`,
            ...semantic.map((line) => `- ${line}`),
            ``,
            `## Structural comparison`,
            `- FBX mesh nodes: ${sourceMeshes.map((node) => node.name).join(', ')}`,
            `- GLB mesh nodes: ${targetMeshes.map((node) => node.name).join(', ')}`,
            `- FBX materials: ${[...sourceMaterials].join(', ')}`,
            `- GLB materials: ${[...targetMaterials].join(', ')}`,
            `- Diamond separate from GEMS: ${targetDiamond?.parent !== targetGems?.parent || targetDiamond?.name !== targetGems?.name ? 'PASS' : 'FAIL'}`,
            `- Ring/Gold separation: ${ringTargetMeshes.some((node) => node.materials.includes('Gold')) ? 'PASS' : 'FAIL'}`,
            ``,
            `## Discrepancies`,
            ...(discrepancies.length ? discrepancies.map((item) => `- ${item}`) : ['- None']),
          ].join('\\n') + '\\n'
          writeFileSync(reportPath, report)
          console.log(report)
          if (discrepancies.length) process.exit(1)
          NODE

      - name: Upload conversion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diamond-ring-blender-conversion-validation
          if-no-files-found: error
          path: |
            public/models/diamond_ring_candidate_blender.glb
            conversion-validation-report.md